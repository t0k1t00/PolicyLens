# Rule 3 of 5: unauthenticated compute + access to secrets/credentials.
#
# Chain: a Lambda function that anyone can invoke without authentication
# (a resource-based permission granting `principal = "*"` with no
# `source_arn` restriction -- computed in classify.rs as
# `_derived.publicly_invokable`) runs as a role that in turn has an IAM
# grant reaching a Secrets Manager secret. Individually: "this Lambda is
# public" might be intentional (a public webhook handler), and "this role
# can read a secret" is often necessary (the function needs a DB
# credential). Together: an unauthenticated caller can trigger code that
# has a path to read that secret -- exactly the kind of chain a
# single-resource scanner, which would check IAM grants and Lambda
# permissions as separate, unrelated findings, has no way to connect.
id: unauthenticated-compute-secret-access
title: "Unauthenticated Lambda function has a path to a Secrets Manager secret"
description: >
  A Lambda function is invocable without authentication (a permission
  grants `"*"` with no `source_arn` restriction) and its execution role has
  an IAM grant reaching an `aws_secretsmanager_secret` resource. This means
  an anonymous caller can trigger execution of code that runs with
  credentials capable of reading that secret.
severity_base: critical
max_total_hops: 2
path:
  - node:
      kind: LambdaFunction
      where: "_derived.publicly_invokable == true"
      bind: public_lambda
  - edge:
      kind: References
      where: 'attr_path == "role"'
  - node:
      kind: IamRole
      bind: execution_role
  - edge:
      kind: IamGrants
  - node:
      kind: SecretsManagerSecret
      bind: secret
